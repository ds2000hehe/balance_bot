# Gamepad defaults for joystick.launch.py (the robot container uses jetson/config/joystick.yaml).
#
# Axis / button NUMBERS are not set here: they depend on the driver, so measure them once with
#   docker compose exec -it joystick ros2 run balance_bot_policy joy_calibrate
# which writes joystick_map.yaml next to this file (loaded on top of it). The numbers below are only fallbacks.
# Check what the controller sends:  docker compose exec joystick ros2 topic echo /joy

joy_node:
  ros__parameters:
    device_id: 0                 # first gamepad (it may also be connected after boot: joy_node picks it up)
    deadzone: 0.0                # joy_teleop applies its own stick dead zone (a joy_node dead zone also hits triggers)
    autorepeat_rate: 20.0        # Hz, keeps /joy flowing while nothing changes (joy_teleop stops on silence)

joy_teleop:
  ros__parameters:
    # driving: the sticks only drive while R2 (dead-man) is held; releasing it sends one zero command and the
    # robot stops and stands. Circle starts balancing, Cross stops it (motors off: the robot falls over).
    forward_scale: 0.5           # m/s at full left stick up
    turn_scale: 1.5              # rad/s at full right stick sideways
    stick_deadzone: 0.15         # fraction of stick travel ignored around centre (stick drift); raise if it creeps
    publish_rate: 20.0           # Hz of /cmd_vel while R2 is held
    joy_timeout: 0.5             # s without /joy (controller gone) -> zero command
    cmd_vel_topic: "/cmd_vel"
    enable_topic: "/balance_bot/enable"
    # fallbacks until joy_calibrate has run (SDL game-controller order)
    forward_axis: 1
    forward_sign: -1.0
    turn_axis: 2
    turn_sign: -1.0
    deadman_button: -1
    deadman_axis: 5
    deadman_rest: 1.0
    deadman_pressed: -1.0
    start_button: 1
    stop_button: 0
