# PS4 controller: Circle / Cross start / stop balancing (joy_enable). Edit and restart:  docker compose restart joystick
#
# Driving uses teleop_twist_joy's standard settings (its ps3 config, as  ros2 launch teleop_twist_joy teleop-launch.py):
#   hold the enable button (button 8) and use the LEFT stick: up / down = forward / back (0.7 m/s),
#   left / right = turn (0.4 rad/s); also hold button 10 for turbo (1.5 m/s). joy_node dead zone 0.3.
# Check button numbers with:  docker compose exec joystick ros2 topic echo /joy

joy_enable:
  ros__parameters:
    start_button: 1              # Circle: start balancing (from lying down it gets up by itself)
    stop_button: 0               # Cross: stop (motors off: the robot falls over)
    joy_topic: "/joy"
    enable_topic: "/balance_bot/enable"
